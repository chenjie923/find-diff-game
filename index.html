<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大家来找茬 - 特征配准+自动对齐版本</title>
<script src="https://cdn.jsdelivr.net/npm/opencv-js@4.8.0/dist/opencv.min.js"></script>
<style>
*{box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
body{background:#f4f7fa;padding:20px;max-width:1200px;margin:0 auto;}
h1{text-align:center;color:#2c3e50;}
.panel{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px #00000015;}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:10px 0;}
.upload-box{flex:1;min-width:280px;}
input[type="file"]{width:100%;padding:8px;}
.param-item{flex:1;min-width:220px;}
label{display:block;margin-bottom:4px;color:#34495e;font-weight:500;}
input[type="range"]{width:100%;}
.btns{display:flex;gap:12px;margin:16px 0;}
button{padding:10px 24px;border:none;border-radius:8px;background:#2980b9;color:white;font-size:16px;cursor:pointer;}
button#reset{background:#7f8c8d;}
#log{background:#1f2937;color:#39ff14;padding:12px;border-radius:8px;min-height:80px;white-space:pre-wrap;}
.canvas-wrap{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;}
canvas{border:1px solid #ddd;border-radius:8px;max-width:100%;}
.info{color:#c0392b;font-weight:bold;font-size:18px;}
</style>
</head>
<body>
<h1>大家来找茬｜ORB特征配准 + 像素对齐检测</h1>
<div class="panel">
    <div class="row">
        <div class="upload-box">
            <label>参考图A（基准图）</label>
            <input type="file" id="img1Input" accept="image/*">
        </div>
        <div class="upload-box">
            <label>待对齐图B（会自动对齐到A）</label>
            <input type="file" id="img2Input" accept="image/*">
        </div>
    </div>
    <div class="row">
        <div class="param-item">
            <label>差分阈值：<span id="threshVal">30</span></label>
            <input type="range" id="thresh" min="5" max="100" value="30">
        </div>
        <div class="param-item">
            <label>最小轮廓面积：<span id="areaVal">80</span></label>
            <input type="range" id="minArea" min="10" max="400" value="80">
        </div>
    </div>
    <div class="btns">
        <button id="runBtn">对齐并检测差异</button>
        <button id="reset">重置</button>
    </div>
    <div class="info">检测结果：<span id="resultText">等待运行</span></div>
    <div id="log">系统日志：等待OpenCV加载</div>
    <div class="canvas-wrap">
        <div>
            <p>原图A（基准）</p>
            <canvas id="c1"></canvas>
        </div>
        <div>
            <p>原图B（原始）</p>
            <canvas id="c2"></canvas>
        </div>
        <div>
            <p>B对齐后 + 差异红框</p>
            <canvas id="cOut"></canvas>
        </div>
    </div>
</div>

<script>
let cvReady = false;
let img1 = null, img2 = null;
const $ = s=>document.querySelector(s);
const logDom = $("#log");
const resultText = $("#resultText");
const c1 = $("#c1"), c2 = $("#c2"), cOut = $("#cOut");
const ctx1 = c1.getContext('2d');
const ctx2 = c2.getContext('2d');
const ctxOut = cOut.getContext('2d');

const threshSlider = $("#thresh");
const areaSlider = $("#minArea");
$("#threshVal").innerText = threshSlider.value;
$("#areaVal").innerText = areaSlider.value;
threshSlider.oninput = ()=>$("#threshVal").innerText = threshSlider.value;
areaSlider.oninput = ()=>$("#areaVal").innerText = areaSlider.value;

function log(msg){
    logDom.innerText = "系统日志："+msg;
}

cv['onRuntimeInitialized'] = ()=>{
    cvReady = true;
    log("✅ OpenCV加载完成，可以上传图片");
}

$("#img1Input").onchange = async e=>{
    img1 = await loadImg(e.target.files[0]);
    drawImg(img1,c1);
}
$("#img2Input").onchange = async e=>{
    img2 = await loadImg(e.target.files[0]);
    drawImg(img2,c2);
}

function loadImg(file){
    return new Promise(resolve=>{
        const i = new Image();
        i.onload = ()=>resolve(i);
        i.src = URL.createObjectURL(file);
    })
}
function drawImg(img,canvas){
    canvas.width = img.width;
    canvas.height = img.height;
    canvas.getContext('2d').drawImage(img,0,0);
}

$("#reset").onclick = ()=>{
    img1=null;img2=null;
    ctx1.clearRect(0,0,c1.width,c1.height);
    ctx2.clearRect(0,0,c2.width,c2.height);
    ctxOut.clearRect(0,0,cOut.width,cOut.height);
    resultText.innerText="等待运行";
    log("已重置");
}

$("#runBtn").onclick = ()=>{
    if(!cvReady){
        log("❌ OpenCV还未加载完成，请等待");
        return;
    }
    if(!img1 || !img2){
        log("❌ 请上传两张图片");
        return;
    }
    runRegisterAndDetect();
}

// 核心：ORB配准 + 单应变换对齐 + 差分检测
function runRegisterAndDetect(){
    log("🔍 开始ORB特征提取、图像配准对齐...");
    const threshVal = Number(threshSlider.value);
    const minAreaVal = Number(areaSlider.value);

    // 从canvas读取Mat
    const matA = cv.imread(c1);
    const matB = cv.imread(c2);
    const grayA = new cv.Mat();
    const grayB = new cv.Mat();
    cv.cvtColor(matA, grayA, cv.COLOR_RGBA2GRAY);
    cv.cvtColor(matB, grayB, cv.COLOR_RGBA2GRAY);

    // ORB检测器
    const orb = new cv.ORB(500);
    const kpA = new cv.KeyPointVector();
    const kpB = new cv.KeyPointVector();
    const desA = new cv.Mat();
    const desB = new cv.Mat();
    orb.detectAndCompute(grayA, new cv.Mat(), kpA, desA);
    orb.detectAndCompute(grayB, new cv.Mat(), kpB, desB);

    // BFMatcher匹配
    const bf = new cv.BFMatcher(cv.NORM_HAMMING, true);
    const matches = new cv.DMatchVector();
    bf.match(desA, desB, matches);

    if(matches.size() < 10){
        log("⚠️ 特征匹配点太少，对齐失败！两张图差异过大/无共同特征");
        matA.delete();matB.delete();grayA.delete();grayB.delete();
        orb.delete();bf.delete();desA.delete();desB.delete();
        kpA.delete();kpB.delete();matches.delete();
        return;
    }

    // 提取匹配点，计算单应矩阵H
    const srcPts = [];
    const dstPts = [];
    for(let i=0;i<matches.size();i++){
        const m = matches.get(i);
        const ptA = kpA.get(m.queryIdx).pt;
        const ptB = kpB.get(m.trainIdx).pt;
        srcPts.push(ptB.x, ptB.y);
        dstPts.push(ptA.x, ptA.y);
    }
    const srcMat = cv.matFromArray(srcPts.length/2, 1, cv.CV_32FC2, srcPts);
    const dstMat = cv.matFromArray(dstPts.length/2, 1, cv.CV_32FC2, dstPts);
    const H = cv.findHomography(srcMat, dstMat, cv.RANSAC, 5.0);

    // 透视变换：把B对齐到A的尺寸和坐标
    const alignedB = new cv.Mat();
    cv.warpPerspective(matB, alignedB, H, new cv.Size(matA.cols, matA.rows));

    // 灰度差分
    const grayAlignedB = new cv.Mat();
    cv.cvtColor(alignedB, grayAlignedB, cv.COLOR_RGBA2GRAY);
    const diff = new cv.Mat();
    cv.absdiff(grayA, grayAlignedB, diff);
    const bin = new cv.Mat();
    cv.threshold(diff, bin, threshVal, 255, cv.THRESH_BINARY);

    // 轮廓查找
    const contours = new cv.MatVector();
    const hierarchy = new cv.Mat();
    cv.findContours(bin, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

    // 在对齐后的图上绘制红框
    const outMat = alignedB.clone();
    let count = 0;
    for(let i=0;i<contours.size();i++){
        const cnt = contours.get(i);
        const area = cv.contourArea(cnt);
        if(area > minAreaVal){
            count++;
            const rect = cv.boundingRect(cnt);
            cv.rectangle(outMat, new cv.Point(rect.x,rect.y), new cv.Point(rect.x+rect.width,rect.y+rect.height), [255,0,0,255],2);
        }
    }

    // 输出到canvas
    cOut.width = outMat.cols;
    cOut.height = outMat.rows;
    cv.imshow(cOut, outMat);

    resultText.innerText = `一共找到 ${count} 处差异`;
    log("✅ 对齐完成，差异检测结束");

    // 释放内存，防止页面卡顿
    matA.delete();matB.delete();grayA.delete();grayB.delete();
    alignedB.delete();grayAlignedB.delete();diff.delete();bin.delete();
    srcMat.delete();dstMat.delete();H.delete();outMat.delete();
    orb.delete();bf.delete();desA.delete();desB.delete();
    kpA.delete();kpB.delete();matches.delete();
    contours.delete();hierarchy.delete();
}
</script>
</body>
</html>
